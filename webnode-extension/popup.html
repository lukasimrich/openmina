<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8" />
        <title>OpenMina Node</title>
        <style>
            body {
                width: 350px;
                padding: 16px;
                font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            }

            .header {
                text-align: center;
                margin-bottom: 20px;
            }

            .status-card {
                background: #f5f5f5;
                border-radius: 8px;
                padding: 12px;
                margin-bottom: 16px;
            }

            .status-indicator {
                display: inline-block;
                width: 8px;
                height: 8px;
                border-radius: 50%;
                margin-right: 8px;
            }

            .status-running {
                background: #4caf50;
            }
            .status-error {
                background: #f44336;
            }
            .status-idle {
                background: #9e9e9e;
            }

            button {
                width: 100%;
                padding: 10px;
                border: none;
                border-radius: 6px;
                background: #2196f3;
                color: white;
                cursor: pointer;
                font-size: 14px;
            }

            button:hover {
                background: #1976d2;
            }

            button:disabled {
                background: #cccccc;
                cursor: not-allowed;
            }

            .details {
                font-size: 12px;
                color: #666;
                margin-top: 8px;
            }
        </style>
    </head>
    <body>
        <div class="header">
            <h2>OpenMina Node</h2>
        </div>

        <div class="status-card">
            <div id="status-display">
                <span class="status-indicator status-idle"></span>
                <span id="status-text">Node Idle</span>
            </div>
            <div class="details" id="status-details">Click "Start Node" to initialize</div>
        </div>

        <button id="start-btn">Start Node</button>
        <button id="status-btn" style="margin-top: 8px;" disabled>Get Status</button>

        <script src="popup.js" type="module"></script>
    </body>
</html>
